<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HC API Tester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f2ec;
      --panel: #fffdf8;
      --ink: #1f1e1b;
      --muted: #68655f;
      --line: #ded7cb;
      --brand: #0d6b57;
      --accent: #c64828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(13,107,87,0.12), transparent 42%),
        radial-gradient(circle at 90% 90%, rgba(198,72,40,0.10), transparent 36%),
        var(--bg);
    }
    .wrap {
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: 100vh;
      gap: 14px;
      padding: 14px;
    }
    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 14px;
      overflow: hidden;
    }
    .head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #f9f5ee);
      display: grid;
      gap: 8px;
    }
    .title { font-size: 18px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 13px; }
    .row { display: flex; gap: 8px; }
    input, select, textarea, button {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
      color: var(--ink);
    }
    button {
      cursor: pointer;
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      font-weight: 600;
    }
    button.ghost {
      background: #fff;
      color: var(--ink);
      border-color: var(--line);
    }
    .list {
      max-height: calc(100vh - 172px);
      overflow: auto;
      padding: 8px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      margin: 0 0 8px;
      cursor: pointer;
      background: #fff;
    }
    .item.active {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(13,107,87,0.14);
    }
    .badge {
      display: inline-block;
      min-width: 52px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 4px 8px;
      margin-right: 8px;
      color: #fff;
    }
    .GET { background: #3178c6; }
    .POST { background: #1f9d55; }
    .PUT { background: #e08b00; }
    .DELETE { background: #d84315; }
    .PATCH, .HEAD, .OPTIONS { background: #6c4aa6; }
    .path {
      font-size: 13px;
      word-break: break-all;
    }
    .editor {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: calc(100vh - 28px);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    .field {
      display: grid;
      gap: 6px;
      font-size: 13px;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
    }
    .result {
      border-top: 1px solid var(--line);
      padding: 10px;
      overflow: auto;
    }
    pre {
      margin: 0;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, "Courier New", monospace;
    }
    .status { font-weight: 700; color: var(--accent); }
    @media (max-width: 980px) {
      .wrap { grid-template-columns: 1fr; }
      .list { max-height: 320px; }
      .editor { min-height: 560px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel">
      <div class="head">
        <div class="title">HC API Route Tester</div>
        <div class="sub" id="countText">Loading routes...</div>
        <div class="row">
          <input id="searchInput" placeholder="Search by path or file..." style="flex:1" />
          <select id="methodFilter">
            <option value="ALL">ALL</option>
            <option>GET</option>
            <option>POST</option>
            <option>PUT</option>
            <option>DELETE</option>
            <option>PATCH</option>
            <option>HEAD</option>
            <option>OPTIONS</option>
          </select>
        </div>
      </div>
      <div class="list" id="routeList"></div>
    </section>

    <section class="panel editor">
      <div class="head">
        <div class="title" id="selectedTitle">Select an API from left</div>
        <div class="sub" id="selectedSource"></div>
      </div>
      <div class="grid">
        <div class="field">
          <label>Method</label>
          <select id="methodInput">
            <option>GET</option><option>POST</option><option>PUT</option>
            <option>DELETE</option><option>PATCH</option><option>HEAD</option><option>OPTIONS</option>
          </select>
        </div>
        <div class="field">
          <label>URL</label>
          <input id="urlInput" />
        </div>
        <div class="field">
          <label>Headers (JSON object)</label>
          <textarea id="headersInput">{ "content-type": "application/json" }</textarea>
        </div>
        <div class="field">
          <label>Body (JSON)</label>
          <textarea id="bodyInput"></textarea>
        </div>
      </div>
      <div class="head">
        <div class="row">
          <button id="sendBtn">Run Request</button>
          <button class="ghost" id="formatBtn">Format JSON</button>
        </div>
      </div>
      <div class="result">
        <div class="sub"><span class="status" id="resultStatus">No call yet</span></div>
        <pre id="resultBody"></pre>
      </div>
    </section>
  </div>

  <script src="/api-tester/app.js"></script>
</body>
</html>
